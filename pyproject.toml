[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopipe"
version = "0.1.0"
description = "Crypto market data pipeline: Kafka, Spark, HDFS and Cassandra on Kubernetes (Lambda architecture)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyspark>=3.5,<3.6",
  "pydantic>=2",
  "pydantic-settings",
  "typer",
  "confluent-kafka",
  "websockets",
  "httpx",
  "prometheus-client",
  "pyyaml",
  "cassandra-driver",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "chispa",
  "ruff",
  "pre-commit",
]

[project.scripts]
crypto = "cryptopipe.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cryptopipe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
  "integration: needs a running cluster (Kafka, HDFS, Cassandra); run with `make test-integration`",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option(...) in argument defaults is the Typer idiom
