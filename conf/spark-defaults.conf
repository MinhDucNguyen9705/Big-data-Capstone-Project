# Cluster defaults, baked into the Spark image at /opt/spark/conf (owner A).
# Per-job settings (memory, cores, job arguments) go in deploy/spark/*.yaml.
# Local mode (get_spark(..., local=True)) does not read this file.
spark.sql.session.timeZone                      UTC
spark.driver.extraJavaOptions                   -Duser.timezone=UTC
spark.executor.extraJavaOptions                 -Duser.timezone=UTC
spark.serializer                                org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.sources.partitionOverwriteMode        dynamic
spark.sql.parquet.compression.codec             zstd
spark.sql.streaming.metricsEnabled              true
spark.sql.streaming.stateStore.providerClass    org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider

# HDFS client: reach DataNodes by DNS name (pod IPs change on restart)
spark.hadoop.dfs.client.use.datanode.hostname   true

# Prometheus endpoints (scraped via PodMonitor in deploy/monitoring)
spark.ui.prometheus.enabled                     true
spark.metrics.conf.*.sink.prometheusServlet.class   org.apache.spark.metrics.sink.PrometheusServlet
spark.metrics.conf.*.sink.prometheusServlet.path    /metrics/prometheus
spark.metrics.namespace                         ${spark.app.name}
