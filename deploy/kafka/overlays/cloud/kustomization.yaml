# PROFILE=cloud (stub, finished in Q2): 3 dual-role nodes, RF 3, min.insync.replicas 2.
# TODO(Q2): external listener type loadbalancer (no advertisedHost: localhost), SSD storage class, TLS + SCRAM (Q1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: KafkaNodePool, name: dual }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Kafka, name: crypto }
    patch: |-
      - op: replace
        path: /spec/kafka/config
        value:
          default.replication.factor: 3
          min.insync.replicas: 2
          offsets.topic.replication.factor: 3
          transaction.state.log.replication.factor: 3
          transaction.state.log.min.isr: 2
          auto.create.topics.enable: false
      - op: replace
        path: /spec/kafka/listeners/1
        value:
          name: external
          port: 9094
          type: loadbalancer
          tls: false
