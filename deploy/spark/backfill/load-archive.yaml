# Owner: D (Batch and data), task A6/A8. On demand only (not applied by `make deploy`); see README.md here.
# lake raw/archive/<kind> (archive-download-job.yaml) -> bronze/archive_trades and bronze/archive_klines.
# Rerunning replaces the same date partitions; it refuses to drop symbols that are not in raw/archive.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: batch-load-archive-trades
  namespace: spark
  labels:
    app.kubernetes.io/part-of: crypto-pipeline
    app.kubernetes.io/component: batch
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  sparkVersion: 3.5.9
  image: cryptopipe-spark:latest
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/cryptopipe/jobs/batch_load_archive.py
  arguments: ["--kind", "trades"]
  hadoopConfigMap: hadoop-conf
  sparkConf:
    spark.kubernetes.driver.service.deleteOnTermination: "true"
    spark.sql.shuffle.partitions: "16"
  restartPolicy:
    type: Never                        # one-off backfill: inspect a failure, fix, re-apply (reruns are idempotent)
  timeToLiveSeconds: 86400
  driver:
    cores: 1
    coreLimit: "1"
    memory: 1g
    memoryOverhead: 384m
    serviceAccount: spark
    envFrom:
      - configMapRef: { name: cryptopipe-env }
    labels:
      app.kubernetes.io/part-of: crypto-pipeline
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "4040"
      prometheus.io/path: /metrics/prometheus/
  executor:
    instances: 1                       # laptop kind budget; raise on the cloud cluster
    cores: 1
    coreLimit: "1"
    memory: 2g
    memoryOverhead: 384m
    envFrom:
      - configMapRef: { name: cryptopipe-env }
    labels:
      app.kubernetes.io/part-of: crypto-pipeline
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "4040"
      prometheus.io/path: /metrics/executors/prometheus/
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: batch-load-archive-klines
  namespace: spark
  labels:
    app.kubernetes.io/part-of: crypto-pipeline
    app.kubernetes.io/component: batch
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  sparkVersion: 3.5.9
  image: cryptopipe-spark:latest
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/cryptopipe/jobs/batch_load_archive.py
  arguments: ["--kind", "klines"]
  hadoopConfigMap: hadoop-conf
  sparkConf:
    spark.kubernetes.driver.service.deleteOnTermination: "true"
    spark.sql.shuffle.partitions: "8"
  restartPolicy:
    type: Never                        # one-off backfill: inspect a failure, fix, re-apply (reruns are idempotent)
  timeToLiveSeconds: 86400
  driver:
    cores: 1
    coreLimit: "1"
    memory: 1g
    memoryOverhead: 384m
    serviceAccount: spark
    envFrom:
      - configMapRef: { name: cryptopipe-env }
    labels:
      app.kubernetes.io/part-of: crypto-pipeline
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "4040"
      prometheus.io/path: /metrics/prometheus/
  executor:
    instances: 1
    cores: 1
    coreLimit: "1"
    memory: 1500m
    memoryOverhead: 384m
    envFrom:
      - configMapRef: { name: cryptopipe-env }
    labels:
      app.kubernetes.io/part-of: crypto-pipeline
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "4040"
      prometheus.io/path: /metrics/executors/prometheus/
