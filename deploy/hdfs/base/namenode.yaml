# HDFS NameNode (1 replica). Owner: A (Platform).
# The init container formats the metadata directory ONLY when /data/namenode/current/VERSION does not exist,
# so a pod restart or a rerun of `make deploy` never re-formats (which would orphan every block on the DataNodes).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-namenode
  labels: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: namenode }
spec:
  serviceName: hdfs-namenode-hl
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: namenode }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hdfs
        app.kubernetes.io/component: namenode
        app.kubernetes.io/part-of: crypto-pipeline
    spec:
      securityContext:
        runAsUser: 1000   # `hadoop` in apache/hadoop:3.3.6 (`docker run --rm apache/hadoop:3.3.6 id`)
        runAsGroup: 100
        fsGroup: 100      # PVC files group-writable by the hadoop user
      initContainers:
        - name: config-and-format
          image: apache/hadoop:3.3.6
          imagePullPolicy: IfNotPresent
          command: ["bash", "-ec"]
          args:
            - |
              cp -r /opt/hadoop/etc/hadoop/. /conf/
              cp /config/core-site.xml /config/hdfs-site.xml /conf/
              if [ -f /data/namenode/current/VERSION ]; then
                echo "existing NameNode metadata, not formatting:"; grep clusterID /data/namenode/current/VERSION
              else
                echo "no /data/namenode/current/VERSION: formatting a new NameNode (clusterId crypto-lake)"
                hdfs namenode -format -nonInteractive -force -clusterId crypto-lake
              fi
          env:
            - { name: HADOOP_CONF_DIR, value: /conf }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: conf, mountPath: /conf }
            - { name: data, mountPath: /data }
      containers:
        - name: namenode
          image: apache/hadoop:3.3.6
          imagePullPolicy: IfNotPresent
          command: ["hdfs", "namenode"]
          env:
            - { name: HADOOP_CONF_DIR, value: /conf }
            - { name: HADOOP_HEAPSIZE_MAX, value: 768m }
          ports:
            - { name: rpc, containerPort: 8020 }
            - { name: http, containerPort: 9870 }
          readinessProbe:
            httpGet: { path: /, port: 9870 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8020 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: conf, mountPath: /conf }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: hdfs-config }
        - name: conf
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 10Gi }
