# HDFS DataNodes (local: 2; overlays change the count). Owner: A (Platform).
# Each DataNode registers as <pod>.hdfs-datanode.storage.svc.cluster.local instead of its pod IP, so clients in
# other namespaces (Spark in `spark`) can reach it and the identity survives pod restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-datanode
  labels: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: datanode }
spec:
  serviceName: hdfs-datanode
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: datanode }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hdfs
        app.kubernetes.io/component: datanode
        app.kubernetes.io/part-of: crypto-pipeline
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: datanode }
      initContainers:
        - name: config-and-wait
          image: apache/hadoop:3.3.6
          imagePullPolicy: IfNotPresent
          command: ["bash", "-ec"]
          args:
            - |
              cp -r /opt/hadoop/etc/hadoop/. /conf/
              cp /config/core-site.xml /config/hdfs-site.xml /conf/
              fqdn="$(hostname).hdfs-datanode.storage.svc.cluster.local"
              sed -i "s|</configuration>|  <property><name>dfs.datanode.hostname</name><value>${fqdn}</value></property>\n</configuration>|" /conf/hdfs-site.xml
              echo "dfs.datanode.hostname=${fqdn}"
              until nc -z hdfs-namenode.storage 8020; do echo "waiting for hdfs-namenode.storage:8020"; sleep 3; done
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: conf, mountPath: /conf }
      containers:
        - name: datanode
          image: apache/hadoop:3.3.6
          imagePullPolicy: IfNotPresent
          command: ["hdfs", "datanode"]
          env:
            - { name: HADOOP_CONF_DIR, value: /conf }
            - { name: HADOOP_HEAPSIZE_MAX, value: 512m }
          ports:
            - { name: data, containerPort: 9866 }
            - { name: http, containerPort: 9864 }
            - { name: ipc, containerPort: 9867 }
          readinessProbe:
            httpGet: { path: /, port: 9864 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9866 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: conf, mountPath: /conf }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: hdfs-config }
        - name: conf
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 20Gi }
