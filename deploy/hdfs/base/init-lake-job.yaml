# Creates the lake folders (from contracts.LAKE_PATHS, see lake-dirs.generated.txt), /spark-events and
# /user/spark, owned by `spark` (uid 185 in the Spark image) with mode 775. Owner: A (Platform).
# Re-runnable: mkdir -p / chown / chmod are idempotent. A Job's pod template is immutable, so
# deploy/scripts/deploy-all.sh deletes the finished Job (never data) before applying it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: hdfs-init-lake
  labels: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: init-lake }
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: init-lake }
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000   # `hadoop` started the NameNode, so it is the HDFS superuser
        runAsGroup: 100
      containers:
        - name: init-lake
          image: apache/hadoop:3.3.6
          imagePullPolicy: IfNotPresent
          command: ["bash", "-ec"]
          args:
            - |
              mkdir -p /tmp/conf && cp -r /opt/hadoop/etc/hadoop/. /tmp/conf/ && cp /config/*.xml /tmp/conf/
              export HADOOP_CONF_DIR=/tmp/conf
              until nc -z hdfs-namenode.storage 8020; do echo "waiting for hdfs-namenode.storage:8020"; sleep 3; done
              hdfs dfsadmin -safemode wait
              dirs="$(grep -v '^#' /dirs/lake-dirs.txt | tr '\n' ' ')"
              hdfs dfs -mkdir -p $dirs
              hdfs dfs -chown spark:spark $dirs
              hdfs dfs -chmod 775 $dirs
              hdfs dfs -ls -d $dirs
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: dirs, mountPath: /dirs }
      volumes:
        - name: config
          configMap: { name: hdfs-config }
        - name: dirs
          configMap: { name: hdfs-lake-dirs }
