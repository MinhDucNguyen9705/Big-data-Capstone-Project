# HDFS Services. Owner: A (Platform).
# hdfs-namenode is a normal ClusterIP Service on purpose: its virtual IP never changes, so DataNodes and clients
# that cached the resolved address keep working after the NameNode pod restarts with a new pod IP.
apiVersion: v1
kind: Service
metadata:
  name: hdfs-namenode
  labels: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: namenode }
spec:
  selector: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: namenode }
  ports:
    - { name: rpc, port: 8020, targetPort: 8020 }
    - { name: http, port: 9870, targetPort: 9870 }
---
# Governing (headless) Service of the NameNode StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: hdfs-namenode-hl
  labels: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: namenode }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: namenode }
  ports:
    - { name: rpc, port: 8020 }
---
# NameNode web UI on the laptop: kind maps NodePort 30870 -> localhost:9870.
apiVersion: v1
kind: Service
metadata:
  name: hdfs-namenode-ui
  labels: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: namenode }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: namenode }
  ports:
    - { name: http, port: 9870, targetPort: 9870, nodePort: 30870 }
---
# Headless Service of the DataNodes: gives each pod a stable DNS name
# hdfs-datanode-<i>.hdfs-datanode.storage.svc.cluster.local, which the DataNode registers with
# (dfs.datanode.hostname) and which clients in any namespace use to read and write blocks.
# publishNotReadyAddresses: the name must resolve while the DataNode is still starting and registering.
apiVersion: v1
kind: Service
metadata:
  name: hdfs-datanode
  labels: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: datanode }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: hdfs, app.kubernetes.io/component: datanode }
  ports:
    - { name: data, port: 9866 }
    - { name: http, port: 9864 }
    - { name: ipc, port: 9867 }
