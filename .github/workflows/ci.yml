name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install, lint, unit tests
        run: make install lint test

      - name: Fixtures match the seed
        run: make fixtures-check

      - name: Walking skeleton
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/crypto demo local

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build ingest image
        run: docker build -f docker/ingest/Dockerfile -t cryptopipe-ingest:ci .
      - name: Ingest image runs the CLI
        run: docker run --rm cryptopipe-ingest:ci contracts show
      - name: Build Spark image (main only, downloads connector jars)
        if: github.ref == 'refs/heads/main'
        run: docker build -f docker/spark/Dockerfile -t cryptopipe-spark:ci .
